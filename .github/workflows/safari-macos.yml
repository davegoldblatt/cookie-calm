name: Safari Mac app candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/*safari*'
      - 'scripts/tests/test_safari_native.py'
      - 'src/**'
      - 'static/**'
      - 'vendor/**'
      - 'package*.json'
      - 'scripts/build.mjs'
      - '.github/workflows/safari-macos.yml'
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m unittest discover -s scripts/tests -p 'test_safari_native.py'
      - run: npm run build:safari
      - run: python3 scripts/build-safari-app.py
      - name: Retain the unsigned candidate and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safari-UNSIGNED-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            build/safari-macos/*UNSIGNED.zip
            build/safari-macos/UNSIGNED-SHA256SUMS.txt
            build/safari-macos/packager.log
            build/safari-macos/xcodebuild.log
            build/safari-macos/generated-project.json
